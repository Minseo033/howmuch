plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.4.0'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.howmuch'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.jsoup:jsoup:1.18.3'
    
    // Firebase Admin SDK
    implementation 'com.google.firebase:firebase-admin:9.3.0'

    // Report image storage
    implementation 'com.cloudinary:cloudinary-http5:2.3.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Local credential files and their PEM-shaped template are never runtime resources.
tasks.withType(Jar).configureEach {
    exclude 'firebase-service-account*.json'
}

// Explicit, offline-data-only benchmark. Ordinary test/build tasks do not run it.
tasks.register('catalogBenchmark', JavaExec) {
    group = 'verification'
    description = 'Compare cold catalog phases using bundled public data, without Firebase or HTTP.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.howmuch.service.CatalogColdBenchmark'
    args (project.findProperty('catalogBenchmarkRuns') ?: '7')
}

// Opt-in recommendation ranking comparison with fixed weather and bundled data only.
tasks.register('todaysPickBenchmark', JavaExec) {
    group = 'verification'
    description = 'Compare local nearby recommendation selection without weather/network/Firebase.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.howmuch.service.TodaysPickBenchmark'
    args (project.findProperty('todaysPickBenchmarkRuns') ?: '7')
}

// Coverage and dependency metadata for the separate SonarQube workflow.
jacoco {
    toolVersion = '0.8.12'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.register('sonarDependencies', Copy) {
    from configurations.testRuntimeClasspath
    into layout.buildDirectory.dir('sonar-libs')
}
