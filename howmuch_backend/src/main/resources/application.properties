spring.application.name=howmuch_backend
# Render 환경에서는 PORT 환경변수를 자동으로 주입해 줌. 로컬에서는 8081 사용
server.port=${PORT:8081}
# Firebase 설정 경로 (Render에서는 Secret File로 주입, 로컬에서는 classpath 사용)
firebase.config.path=${FIREBASE_CONFIG_PATH:classpath:firebase-service-account.json}
# Cloudinary server-side credentials. Keep CLOUDINARY_URL out of client builds and source control.
cloudinary.url=${CLOUDINARY_URL:}
cloudinary.report-folder=${CLOUDINARY_REPORT_FOLDER:howmuch/report-images}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=16MB
report.images.max-uploads-per-hour=${REPORT_IMAGE_MAX_UPLOADS_PER_HOUR:20}
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024

# 세션 토큰 (HMAC-SHA256). 운영 환경에서는 SESSION_SECRET 환경변수로 반드시 덮어쓸 것
# ⚠️ fail-fast: 미설정 시 부팅 거부. dev 기본값은 로컬 전용(allow-dev-secret=true)에서만 허용,
#    운영은 SESSION_ALLOW_DEV_SECRET=false로 설정해 dev 시크릿 부팅을 차단할 것
session.secret=${SESSION_SECRET:dev-only-howmuch-session-secret-change-me}
session.ttl-hours=${SESSION_TTL_HOURS:168}
session.allow-dev-secret=${SESSION_ALLOW_DEV_SECRET:true}

# 외부 API 키 (레포 public — 절대 코드에 하드코딩 금지, Render env로만 주입)
kakao.rest-api-key=${KAKAO_REST_API_KEY:}
gemini.api-key=${GEMINI_API_KEY:}
gemini.timeout-ms=${GEMINI_TIMEOUT_MS:10000}
# 구형/미검증 Gemini 키가 있어도 루트 추천은 기본적으로 로컬 거리순으로 동작합니다.
gemini.route-enabled=${GEMINI_ROUTE_ENABLED:false}
# 기상청 단기예보 API 키 (공공데이터포털 발급, 미설정 시 오늘의 픽 날씨는 안전 실패)
weather.api-key=${WEATHER_API_KEY:}
weather.timeout-ms=${WEATHER_TIMEOUT_MS:10000}
# 착한가격업소 원천 데이터 수동 동기화 키 (어드민 API에서만 실행)
public-data.api-key=${PUBLIC_DATA_API_KEY:}

# AI 채팅 레이트리밋 (유저당 시간당 최대 호출 횟수 — 비용 악용 방지)
ai.chat.max-per-hour=${AI_CHAT_MAX_PER_HOUR:20}
recommendation.route.max-per-hour=${RECOMMENDATION_ROUTE_MAX_PER_HOUR:20}
rate-limit.eviction.delay-ms=${RATE_LIMIT_EVICTION_DELAY_MS:3600000}

# 어드민 페이지 전용 키 (X-Admin-Key 헤더와 대조). 앱 세션(카카오 로그인)과 무관한 별도 비밀번호
# ⚠️ 보안: 레포가 public이라 기본값을 코드에 두지 않음 — Render env ADMIN_KEY로만 주입. 미설정 시 /api/admin/** 은 전부 403
admin.key=${ADMIN_KEY:}

# 공공데이터 매장 캐시 (Firestore 일일 읽기 한도 보호)
# 부팅 로드: 디스크 스냅샷→classpath→Firestore 순. 갱신은 1시간 주기로 확인하되
# 마지막 성공 후 24시간 내엔 Firestore 미호출 (일일 읽기 ~1.1만 1회, 실패 시 1시간 뒤 재시도)
stores.snapshot.path=${STORES_SNAPSHOT_PATH:data/stores-snapshot.json}
stores.refresh.initial-delay-ms=600000
stores.refresh.delay-ms=3600000
stores.user.refresh.initial-delay-ms=300000
stores.user.refresh.delay-ms=1800000
