sonar.organization=minseo033
sonar.projectKey=Minseo033_howmuch
sonar.projectName=howmuch
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# Analyze authored application code, not generated platform/build outputs.
sonar.sources=lib,web,howmuch_backend/src/main/java
sonar.tests=test,howmuch_backend/src/test/java
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,**/generated_plugin_registrant.dart,web/flutter_bootstrap.js,web/flutter_service_worker.js,web/**/*.png,web/**/*.ico

# Reports are produced by .github/workflows/sonarqube.yml.
sonar.dart.lcov.reportPaths=coverage/lcov.info
sonar.java.binaries=howmuch_backend/build/classes/java/main
sonar.java.test.binaries=howmuch_backend/build/classes/java/test
sonar.java.libraries=howmuch_backend/build/sonar-libs/*.jar
sonar.java.test.libraries=howmuch_backend/build/sonar-libs/*.jar
sonar.coverage.jacoco.xmlReportPaths=howmuch_backend/build/reports/jacoco/test/jacocoTestReport.xml
sonar.junit.reportPaths=howmuch_backend/build/test-results/test
sonar.java.source=21
