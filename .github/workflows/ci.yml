name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: howmuch_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Test and build
        run: ./gradlew clean test bootJar

  flutter-web:
    name: Flutter analysis, tests, and web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --reporter compact
      - name: Build web release
        run: flutter build web --release --no-wasm-dry-run
      - name: Check administrator page scripts
        run: node scripts/check_admin_html.mjs

  ios-simulator:
    name: iOS Simulator build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build iOS simulator app
        run: flutter build ios --simulator --debug --no-codesign
